<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get in Touch</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        padding: 48px;
        max-width: 650px;
        width: 100%;
      }

      .header {
        margin-bottom: 32px;
        text-align: center;
      }

      .header h1 {
        font-size: 28px;
        font-weight: 700;
        color: #1a1a1a;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
      }

      .header p {
        font-size: 14px;
        color: #666;
        font-weight: 500;
      }

      .form-group {
        margin-bottom: 24px;
      }

      .form-group:last-of-type {
        margin-bottom: 32px;
      }

      label {
        display: flex;
        align-items: center;
        font-size: 14px;
        font-weight: 600;
        color: #2c2c2c;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .icon {
        width: 16px;
        height: 16px;
        margin-right: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #00a8e8;
      }

      input[type="text"],
      input[type="email"],
      input[type="file"],
      textarea {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-family: inherit;
        font-size: 15px;
        color: #1a1a1a;
        background: #fafbfc;
        transition: all 0.3s ease;
      }

      input[type="text"]:focus,
      input[type="email"]:focus,
      input[type="file"]:focus,
      textarea:focus {
        outline: none;
        background: white;
        border-color: #00a8e8;
        box-shadow: 0 0 0 3px rgba(0, 168, 232, 0.08);
      }

      textarea {
        resize: vertical;
        min-height: 120px;
        font-size: 15px;
      }

      input[type="file"] {
        padding: 12px 16px;
        cursor: pointer;
      }

      input[type="file"]::file-selector-button {
        padding: 8px 16px;
        background: #f0f0f0;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        color: #2c2c2c;
        transition: all 0.2s ease;
        margin-right: 10px;
      }

      input[type="file"]::file-selector-button:hover {
        background: #e0e0e0;
      }

      button {
        width: 100%;
        padding: 14px 24px;
        background: linear-gradient(135deg, #00a8e8 0%, #0086b8 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 15px rgba(0, 168, 232, 0.25);
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 168, 232, 0.35);
      }

      button:active {
        transform: translateY(0);
        box-shadow: 0 2px 10px rgba(0, 168, 232, 0.2);
      }

      @media (max-width: 480px) {
        .container {
          padding: 32px 24px;
        }

        .header h1 {
          font-size: 24px;
        }

        input[type="text"],
        input[type="email"],
        input[type="file"],
        textarea {
          font-size: 16px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        input[type="text"],
        input[type="email"],
        input[type="file"],
        textarea,
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Get in Touch</h1>
        <p>We'd love to hear from you</p>
      </div>

      <form action="/submit" method="post">
        <div class="form-group">
          <label for="name">
            <span class="icon">👤</span>
            Your Name
          </label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="John Doe"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">
            <span class="icon">✉️</span>
            Email Address
          </label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="message">
            <span class="icon">💬</span>
            Your Message
          </label>
          <textarea
            id="message"
            name="message"
            placeholder="Tell us what's on your mind..."
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="file">
            <span class="icon">📎</span>
            Attach a File
          </label>
          <input type="file" id="file" name="file" />
        </div>

        <button type="submit">Send Message</button>
      </form>
    </div>
  </body>
</html>
